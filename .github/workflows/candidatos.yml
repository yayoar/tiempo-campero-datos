name: Candidatos por estación

# 24/11/2026 (decidido con Yayo): todos los días se vuelven a medir, con días nuevos, los umbrales por estación
# que mejoraron en la prueba. Escribe datos/duelo/candidatos.md. No cambia nada de la app.
on:
  schedule:
    - cron: "23 13 * * *"   # todos los días, 10:23 h de Mendoza
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidatos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Medir
        run: python candidatos.py
      - name: Guardar resultado
        run: |
          git config user.name "ayudante-tiempo-campero"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/duelo/candidatos.md datos/duelo/candidatos_estado.json
          git commit -m "Candidatos $(date -u +%Y-%m-%d)" || echo "sin cambios"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 15; done
