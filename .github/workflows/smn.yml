name: Alertas del SMN

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zonda
  cancel-in-progress: false

jobs:
  smn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python smn_alertas.py
      - name: Guardar
        run: |
          git config user.name "ayudante-tiempo-campero"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/smn_alertas.json datos/historial_smn
          git commit -m "SMN $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          git pull --rebase && git push
