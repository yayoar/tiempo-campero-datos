name: Colector (radar y pronósticos de todas las fuentes)

on:
  schedule:
    # 23/11/2026 (Yayo): dos horarios por hora; si GitHub se saltea uno, entra el otro. Nunca corren dos a la vez (concurrency).
    - cron: "11 * * * *"
    - cron: "41 * * * *"   # cada corrida se queda ~5,5 h y guarda una vez por hora
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: colector
  cancel-in-progress: false

jobs:
  colector:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow fsspec h5py aiohttp
      - name: Juntar y guardar cada hora durante ~5,5 horas
        env:
          METEOBLUE_KEY: ${{ secrets.METEOBLUE_KEY }}
          METEORED_KEY: ${{ secrets.METEORED_KEY }}
        run: |
          git config user.name "ayudante-tiempo-campero"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fin=$(( $(date +%s) + 19800 ))
          while true; do
            git pull --rebase --autostash -q || true
            python colector.py || true
            git add datos/radar datos/pronosticos datos/fuentes datos/estaciones datos/duelo datos/smn_wrf
            git commit -q -m "Colector $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
            for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 15; done
            [ $(( $(date +%s) + 3600 )) -gt $fin ] && break
            # 22/11/2026: entre corrida y corrida, el último dato de cada estación cada ~5 minutos (se sube en la corrida siguiente)
            for k in $(seq 11); do sleep 300; python colector.py --inst || true; done
          done
