name: Histórico de pronósticos (Open-Meteo en estaciones de Contingencias)

on:
  schedule:
    - cron: "15 0 * * *"   # justo después de que se renueva la cuota diaria (00 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historico
  cancel-in-progress: false

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python om_historico.py
      - name: Guardar
        run: |
          git config user.name "ayudante-tiempo-campero"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/historico
          git commit -q -m "Histórico Open-Meteo $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 15; done
