name: Puntaje de zonda

on:
  schedule:
    # 23/11/2026 (Yayo): varios horarios por aviso porque GitHub atrasa las corridas; zonda.py decide por la hora real
    # y no repite un aviso ya hecho. Noche (para mañana): 18:30, 19:00, 19:30 y 20:00 h de Mendoza.
    - cron: "30 21 * * *"
    - cron: "0 22 * * *"
    - cron: "30 22 * * *"
    - cron: "0 23 * * *"
    # Mañana (para hoy): 5:00, 5:30, 6:00 y 6:30 h de Mendoza.
    - cron: "0 8 * * *"
    - cron: "30 8 * * *"
    - cron: "0 9 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      producto:
        description: "noche (para mañana) o manana (para hoy)"
        default: "noche"
      fecha:
        description: "fecha AAAA-MM-DD (opcional, para pruebas)"
        default: ""

permissions:
  contents: write

concurrency:
  group: zonda
  cancel-in-progress: false

jobs:
  zonda:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calcular
        run: |
          if [ -n "${{ github.event.inputs.producto }}" ]; then P="${{ github.event.inputs.producto }}"; else P=auto; fi
          python zonda.py "$P" ${{ github.event.inputs.fecha }}
      - name: Guardar resultado
        run: |
          git config user.name "ayudante-tiempo-campero"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/zonda.json datos/zonda_registro.csv
          git commit -m "Zonda $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          git pull --rebase && git push
