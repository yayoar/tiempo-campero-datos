name: Puntaje de zonda

on:
  schedule:
    - cron: "30 22 * * *"   # 19:30 h de Mendoza: aviso para mañana
    - cron: "0 9 * * *"     # 06:00 h de Mendoza: actualización para hoy
  workflow_dispatch:
    inputs:
      producto:
        description: "noche (para mañana) o manana (para hoy)"
        default: "noche"
      fecha:
        description: "fecha AAAA-MM-DD (opcional, para pruebas)"
        default: ""

permissions:
  contents: write

concurrency:
  group: zonda
  cancel-in-progress: false

jobs:
  zonda:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calcular
        run: |
          if [ -n "${{ github.event.inputs.producto }}" ]; then P="${{ github.event.inputs.producto }}";
          elif [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then P=manana; else P=noche; fi
          python zonda.py "$P" ${{ github.event.inputs.fecha }}
      - name: Guardar resultado
        run: |
          git config user.name "ayudante-tiempo-campero"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/zonda.json
          git commit -m "Zonda $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          git pull --rebase && git push
